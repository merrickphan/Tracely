appId: com.tracely.app
productName: Tracely
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # electron-builder packages every production dependency, and
  # @huggingface/transformers drags in ~380MB: onnxruntime-node carries
  # prebuilt binaries for all four platforms (211MB), onnxruntime-web another
  # 130MB of WASM we never reach, and sharp is image decoding for vision
  # models this app has none of.
  #
  # Nothing calls embed() yet, so the whole stack is excluded rather than
  # trimmed — shipping ~95MB of trimmed-but-unused runtime to every user buys
  # nothing. services/ml/index.ts degrades to lexical scoring when the worker
  # can't load, which is exactly what happens here.
  #
  # When Phase 1 wires embeddings into scoring.ts, drop the @huggingface and
  # onnxruntime-node lines and keep the rest, then prune onnxruntime-node's
  # other-platform binaries per target (win32-x64 alone is 60MB of the 211MB).
  #
  # Matches all of @huggingface, not just transformers: v0.3.76 shipped with
  # @huggingface/jinja (410KB) because a package-specific glob missed the
  # transitive dependency.
  - '!node_modules/@huggingface/**'
  - '!node_modules/onnxruntime-node/**'
  - '!node_modules/onnxruntime-web/**'
  - '!node_modules/sharp/**'
  - '!node_modules/@img/**'
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: build/icon.png
    to: icon.png
  - from: resources/uia-watch.ps1
    to: uia-watch.ps1
  - from: resources/scan-apps.ps1
    to: scan-apps.ps1
asarUnpack:
  - '**/*.node'
  - '**/*.wasm'
  # onnxruntime_binding.node loads onnxruntime.dll (and DirectML.dll) from
  # beside itself at runtime. Unpacking the .node without its DLLs would leave
  # the binding resolvable and its dependencies not — a failure that only
  # appears in a packaged build, never in dev. Harmless while the ML stack is
  # excluded above; required the moment it isn't.
  - '**/*.dll'
npmRebuild: false
protocols:
  - name: Tracely OAuth callback
    schemes:
      - tracely
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.productivity
publish:
  provider: github
  owner: merrickphan
  repo: Tracely
  releaseType: release
