appId: com.tracely.app
productName: Tracely
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # The ML stack is INCLUDED as of here, trimmed rather than excluded.
  #
  # It was excluded wholesale through v0.3.76, when nothing called embed().
  # That stopped being true once dense relevance landed in scoring.ts, and the
  # exclusion then became a silent regression rather than a saving: the worker
  # cannot load, services/ml/index.ts degrades to lexical scoring, and the
  # packaged app quietly runs the old word-overlap path while every measurement
  # says otherwise. Nothing errors. Do not re-add a blanket exclusion here
  # without also checking what calls embed().
  #
  # Untrimmed the stack is ~380MB. What is dropped, and why:

  # 202MB of models downloaded during development. The weights that actually
  # ship are fetched into resources/models by scripts/fetch-models.mjs and
  # copied via extraResources below.
  - '!node_modules/@huggingface/transformers/.cache/**'
  # TypeScript sources and type declarations — dist/ is what gets imported.
  - '!node_modules/@huggingface/transformers/src/**'
  - '!node_modules/@huggingface/transformers/types/**'

  # 150MB of onnxruntime binaries for platforms this target is not. Keeping
  # win32/x64 only. Revisit when a mac build is real — dist:mac needs darwin.
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'

  # 128MB of WASM for the browser build. dist/transformers.node.mjs imports
  # onnxruntime-node and never this, so it is genuinely unreachable here.
  - '!node_modules/onnxruntime-web/**'

  # sharp and @img (~20MB) are NOT excluded, despite being image decoding for
  # vision models this app does not have. transformers.node.mjs has a
  # top-level `import sharp from "sharp"`, so excluding it breaks the import
  # of the whole library — and only in the packaged build, never in dev.
  # @img already ships win32-x64 alone; npm resolves those per platform.
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: build/icon.png
    to: icon.png
  - from: resources/uia-watch.ps1
    to: uia-watch.ps1
  - from: resources/scan-apps.ps1
    to: scan-apps.ps1
  # Populated by scripts/fetch-models.mjs, which the dist/release scripts run
  # first. Landing here is what makes services/ml/index.ts set
  # allowRemote=false, so a packaged app never reaches the network for weights
  # and never blocks a student's first analysis on a download.
  - from: resources/models
    to: models
asarUnpack:
  - '**/*.node'
  - '**/*.wasm'
  # worker_threads reads its entry script in native code, which does not go
  # through Electron's asar-aware fs patches — so a worker living inside the
  # archive may simply fail to start, in the packaged build only. When it does,
  # services/ml disables itself and retrieval degrades silently to lexical
  # scoring, which is the same invisible failure v0.3.76 shipped with.
  - out/main/mlWorker.js
  # onnxruntime_binding.node loads onnxruntime.dll (and DirectML.dll) from
  # beside itself at runtime, and sharp's binding does the same with its own
  # DLLs. Unpacking a .node without its DLLs leaves the binding resolvable and
  # its dependencies not — a failure that only appears in a packaged build,
  # never in dev.
  - '**/*.dll'
npmRebuild: false
# Verifies the packed app can actually run embeddings, before the installer is
# built or published. See scripts/afterPack.js for why a green build is not
# sufficient evidence here.
afterPack: scripts/afterPack.js
protocols:
  - name: Tracely OAuth callback
    schemes:
      - tracely
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.productivity
publish:
  provider: github
  owner: merrickphan
  repo: Tracely
  releaseType: release
