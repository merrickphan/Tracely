appId: com.tracely.app
productName: Tracely
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # node-llama-cpp installs a prebuilt native binary per platform/arch/GPU-backend
  # as separate optional-dependency packages; only win-x64 (CPU) and
  # win-x64-vulkan (broad GPU accel, no CUDA toolkit needed) are ever used by
  # this app's win-x64 target. Without these excludes the installer balloons
  # from ~86MB to 360MB+ by bundling arm64/cuda variants nothing here loads.
  - '!node_modules/@node-llama-cpp/win-arm64/**'
  - '!node_modules/@node-llama-cpp/win-x64-cuda/**'
  - '!node_modules/@node-llama-cpp/win-x64-cuda-ext/**'
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: build/icon.png
    to: icon.png
  - from: resources/uia-watch.ps1
    to: uia-watch.ps1
  - from: resources/scan-apps.ps1
    to: scan-apps.ps1
asarUnpack:
  - '**/*.node'
  - '**/*.wasm'
npmRebuild: false
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.productivity
publish:
  provider: github
  owner: merrickphan
  repo: Tracely
  releaseType: release
