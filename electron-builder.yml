appId: com.tracely.app
productName: Tracely
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: build/icon.png
    to: icon.png
  - from: resources/uia-watch.ps1
    to: uia-watch.ps1
  - from: resources/scan-apps.ps1
    to: scan-apps.ps1
asarUnpack:
  - '**/*.node'
  - '**/*.wasm'
npmRebuild: false
protocols:
  - name: Tracely OAuth callback
    schemes:
      - tracely
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.productivity
publish:
  provider: github
  owner: merrickphan
  repo: Tracely
  releaseType: release
